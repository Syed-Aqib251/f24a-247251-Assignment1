<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canteen | 247251</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f1f5f2;
            color: #18352c;
            font-family: Arial, sans-serif;
        }
        main {
            width: 100%;
            max-width: 420px;
            padding: 32px;
            background: white;
            border: 1px solid #d8e4dc;
            border-radius: 16px;
        }
        .student { margin: 0 0 12px; color: #52685c; font-size: 14px; }
        h1 { margin: 0 0 8px; font-size: 36px; }
        .intro { margin: 0 0 28px; color: #52685c; line-height: 1.5; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input {
            width: 100%;
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid #9fb3a6;
            border-radius: 8px;
            font: inherit;
        }
        input:focus-visible, button:focus-visible { outline: 3px solid #85b8a0; outline-offset: 3px; }
        button {
            width: 100%;
            padding: 13px;
            background: #205c42;
            color: white;
            border: 0;
            border-radius: 8px;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #174731; }
        .result { margin-top: 24px; padding: 18px; background: #edf5ef; border-radius: 8px; }
        .result p { margin: 0 0 8px; color: #52685c; }
        output { display: block; overflow-wrap: anywhere; font-size: 32px; font-weight: bold; }
    </style>
</head>
<body>
    <main>
        <p class="student">Full Stack Development Lab &middot; Roll 247251</p>
        <h1>Canteen</h1>
        <p class="intro">Enter a price and quantity to calculate the total.</p>

        <form id="canteen-form">
            <label for="price">Price</label>
            <input id="price" name="price" type="text" inputmode="decimal" placeholder="e.g. 20">

            <label for="quantity">Quantity</label>
            <input id="quantity" name="quantity" type="text" inputmode="numeric" placeholder="e.g. 3">

            <button type="submit">Add</button>
        </form>

        <div class="result">
            <p>Total</p>
            <output id="total" for="price quantity" aria-live="polite">&mdash;</output>
        </div>
    </main>
    <script>
        document.getElementById("canteen-form").addEventListener("submit", function (event) {
            event.preventDefault();

            // Number converts text to a number; non-numeric text such as "ten" becomes NaN.
            const price = Number(document.getElementById("price").value);
            const quantity = Number(document.getElementById("quantity").value);
            document.getElementById("total").textContent = String(price * quantity);
        });
    </script>
</body>
</html>
